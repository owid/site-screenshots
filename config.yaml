- url: ${BASE_URL}/from-1-90-to-2-15-a-day-the-updated-international-poverty-line
  output: screenshots/from-1-90-to-2-15-a-day-the-updated-international-poverty-line.png
  javascript: &default_javascript |
    function () {
      return new Promise(async (resolve, reject) => {
        function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
        }

        // When a page does not settle, the only thing worth knowing is what the browser
        // was doing, and every run so far has left us guessing. shot-scraper gives the
        // page no hook into Playwright's network and console events, so watch what the
        // page itself uses: a chart's config, data and metadata all go through fetch
        // (owid-grapher's loadVariable.ts, via fetchWithRetry), and every uncaught error
        // and rejection reaches window.
        //
        // What this is looking for: fetchWithRetry gives up after five attempts with
        // exponential backoff - about eight seconds - and throws. So a chart still
        // loading three minutes later is more likely one whose request failed and whose
        // failure went nowhere than one still waiting on the network, and those two look
        // identical from the outside. This says which.
        //
        // Attached before the scroll, because the scroll is what brings the charts into
        // view and starts their requests. Nothing here changes what fetch does, and none
        // of it is read unless the page fails to settle.
        const pendingRequests = new Map()
        const failedRequests = []
        const pageErrors = []
        let requestCount = 0
        const nativeFetch = window.fetch
        window.fetch = function () {
          const args = [...arguments]
          const url = args[0] && args[0].url ? args[0].url : String(args[0])
          const id = requestCount++
          pendingRequests.set(id, url)
          function settleRequest(failure) {
            pendingRequests.delete(id)
            if (failure) failedRequests.push(failure + " " + url)
          }
          // apply on window rather than this: a bare fetch() call passes undefined, and
          // the native function rejects an unrelated receiver with "Illegal invocation"
          return nativeFetch.apply(window, args).then(
            function (response) {
              // An opaque response - a no-cors beacon, which is what the analytics
              // collector gets - reports status 0 and ok false however well it went, so
              // there is nothing to read. Left in, it was the whole failure list: each
              // beacon carries a different query string, so they never collapse and they
              // pushed the requests we care about past the cap.
              const opaque = response.type === "opaque"
              settleRequest(opaque || response.ok ? null : "HTTP " + response.status)
              return response
            },
            function (error) {
              settleRequest("failed (" + error.message + ")")
              throw error
            }
          )
        }
        window.addEventListener("error", (event) => {
          pageErrors.push(event.message + " (" + event.filename + ":" + event.lineno + ")")
        })
        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason
          pageErrors.push("unhandled rejection: " +
                          ((reason && reason.message) || String(reason)))
        })

        // Deduplicated because fetchWithRetry makes five attempts, so one broken request
        // appears five times; capped so one pathological URL cannot swamp the message.
        function describeRequests(label, urls) {
          const unique = [...new Set(urls.map((url) => url.slice(0, 200)))]
          if (!unique.length) return "no " + label
          const shown = unique.slice(0, 5)
          return unique.length + " " + label + ": " + shown.join(", ") +
                 (unique.length > shown.length ? ", ..." : "")
        }

        function diagnostics() {
          return [
            describeRequests("failed request(s)", failedRequests),
            describeRequests("request(s) still in flight", [...pendingRequests.values()]),
            describeRequests("page error(s)", pageErrors),
          ].join("; ")
        }

        // The whole thing - scrolling, the settle wait below, the image decode - gets
        // this long. Concatenation, not `${...}` interpolation of a plain name: run.sh
        // pipes this file through envsubst, which would replace it with an empty string.
        const PAGE_TIMEOUT_SECONDS = 300
        setTimeout(() => {
          reject(window.location.href + " took more than " + PAGE_TIMEOUT_SECONDS +
                 " seconds to scroll to the end of the page and fully load. " +
                 diagnostics() + ".")
        }, PAGE_TIMEOUT_SECONDS * 1000)

        while (Math.round(window.scrollY + window.innerHeight) < document.body.scrollHeight) {
          window.scrollBy(0, window.innerHeight / 4);
          await sleep(250);
        }

        // Freeze CSS transitions and animations first. The cookie banner fades in over the
        // last rows of the page, so two runs catch it at different opacities: 2705 pixels
        // differing by 10/255 on the migration explorer - invisible, but enough for the
        // file to show up as changed in the diff.
        const frozenMotion = document.createElement("style")
        frozenMotion.textContent = "*, *::before, *::after { transition: none !important; animation: none !important; }"
        document.head.append(frozenMotion)

        // Now wait for the charts. window._OWID_GRAPHERS_LOADING is how many graphers are
        // loading right now; it is undefined on a site baked before owid-grapher#7020,
        // which is every reference screenshot until that deploys.
        //
        // A count of zero is not by itself the signal we want: charts load lazily as they
        // scroll into view, so the count reads zero both before a chart starts and after
        // it finishes, and a chart that has loaded may still be drawing at the wrong size.
        // Screenshot too early and we catch a spinner, a chart at a fraction of its width
        // or a map on the wrong year, which shifts everything below it and reads as a
        // whole-page diff.
        //
        // Asking only whether anything is loading right now leaves a hole, and branch
        // screenshots have been falling through it: a grapher that has mounted but not yet
        // announced itself has an empty .GrapherComponent, has never incremented the
        // count, and has no spinner up, so all three conditions hold at once and the page
        // reads as finished. On legend-tap the "Key Charts on Energy" carousel was
        // photographed as a white box (68,959 pixels, the branch side pure white), and on
        // mdim-dropdown-search two more went blank on the same page and took 20 pixels of
        // page height with them, which shifted everything below and made 23.6% of the file
        // differ. Nobody can attribute a diff like that.
        //
        // So the question is not "is anything loading?" but "has every chart on the page
        // been drawn?" - see undrawnCharts below. The scroll above makes that answerable:
        // GrapherWithFallback swaps the real grapher in when it comes within 400px of the
        // viewport and freezes the decision, so by the time we get here every visible
        // placeholder has been asked to load. This also turns the older failure into a
        // wait: a slow chart is now waited for instead of being shot early.
        //
        // Three minutes of headroom, because of when this runs: the screenshot step
        // depends on the bake and starts seconds after it, alongside the Cloudflare
        // preview deploy (which pushes the whole baked site, ~100k files, off the box)
        // and the BDD tests. A chart's config is served by the staging container over
        // the LAN and arrives regardless; its data comes from api-staging.owid.io and
        // has to leave the machine, so in that window it is the slow half. Measured on
        // lxc-manager-1 with this same shot-scraper and browser, once those two steps
        // are done: 27 seconds for the poverty-line page, which had timed out at 60 in
        // CI with all 8 charts still empty. Failures were partial too - the energy page
        // on build 32895 had 1 of 3 charts left - which is queueing, not a hang.
        //
        // If it never goes quiet, fail the shot rather than photographing whatever state
        // the page is in. A screenshot with a chart still spinning in it is not a
        // screenshot of this branch - it reads as a whole-page diff and sends the reader
        // looking for a change that isn't there. run.sh passes --fail, so the run stops
        // and says which page; owidbot reports the branch's screenshots as failed. That
        // also bounds what the longer budget can cost: the run gives up at the first page
        // that never settles, so the worst case is the pages before it at their usual
        // half-minute plus one three-minute wait - well inside the step's 20-minute
        // timeout, which every other branch queues behind.
        function fingerprintCharts() {
          return [...document.querySelectorAll(".GrapherComponent")]
            .map((chart) => {
              const rect = chart.getBoundingClientRect();
              return [Math.round(rect.width), Math.round(rect.height), chart.textContent.length].join("x")
            })
            .join(" ")
        }

        // Which charts the page still owes us. Empty means every one of them has drawn
        // something, which is the condition the three signals above cannot express.
        function undrawnCharts() {
          // A hidden placeholder never loads and never should, so waiting for one would
          // hang every run on the two pages that have them: /life-expectancy carries three
          // in the inactive slides of a key-insights slider, visibility: hidden inside a
          // zero-height .slide, and the homepage keeps seven at 0x0. Neither set is in the
          // screenshot.
          //
          // Element.checkVisibility() answers this in one call, but its option names were
          // renamed between the Chromium this repo pins (113) and current ones, and a call
          // that throws in here does not reject the promise - it leaves it unsettled until
          // the 300-second page timeout, so every page would fail. These two primitives
          // are older than any browser we will run and give the same answers (checked
          // against checkVisibility on every placeholder and chart of all seven pages):
          // an element in a display: none subtree has no client rects, whatever its own
          // computed display says, and visibility inherits, so the element's own value
          // already reflects a hidden ancestor.
          function isVisible(element) {
            return element.getClientRects().length > 0 &&
                   getComputedStyle(element).visibility === "visible"
          }
          function describe(element) {
            const rect = element.getBoundingClientRect()
            return Math.round(rect.width) + "x" + Math.round(rect.height) +
                   " at y=" + Math.round(rect.top + window.scrollY)
          }

          const undrawn = []
          for (const placeholder of document.querySelectorAll(".GrapherWithFallback")) {
            if (isVisible(placeholder) && !placeholder.querySelector(".GrapherComponent")) {
              undrawn.push("a placeholder with no chart in it, " + describe(placeholder))
            }
          }
          // Mounted but blank. This is the state that was being photographed: the
          // fingerprint reads 813x575x0 and stays there.
          for (const chart of document.querySelectorAll(".GrapherComponent")) {
            if (isVisible(chart) && !chart.textContent.length) {
              undrawn.push("a chart that has drawn nothing, " + describe(chart))
            }
          }
          return undrawn
        }

        let previousFingerprint = null
        let undrawn = []
        let isQuiet = false
        const SETTLE_TIMEOUT_SECONDS = 180
        for (let attempt = 0; attempt < SETTLE_TIMEOUT_SECONDS * 2 && !isQuiet; attempt++) {
          const fingerprint = fingerprintCharts()
          undrawn = undrawnCharts()
          isQuiet =
            fingerprint === previousFingerprint &&
            !window._OWID_GRAPHERS_LOADING &&
            !document.querySelector(".loading-indicator") &&
            !undrawn.length
          previousFingerprint = fingerprint
          // Two samples a second, which is where the loop bound's factor of 2 comes from
          if (!isQuiet) await sleep(500);
        }

        if (!isQuiet) {
          const loading = window._OWID_GRAPHERS_LOADING
          const spinners = document.querySelectorAll(".loading-indicator").length
          // Concatenation, not `${...}` interpolation of plain names: run.sh pipes this
          // file through envsubst, which would replace them with empty strings.
          reject(
            window.location.href + " never settled after " + SETTLE_TIMEOUT_SECONDS +
            " seconds: " + spinners + " spinner(s), grapher reports " +
            (loading === undefined ? "no count" : loading) + " loading, " +
            (undrawn.length
              ? undrawn.length + " chart(s) not drawn (" + undrawn.join("; ") + ")"
              : "every chart drawn") +
            ", chart sizes " + fingerprintCharts() + ". " + diagnostics() + "."
          )
          return
        }

        // The baked page spells out the origin it was baked for: the "Cite this work"
        // block, the BibTeX note and the data-download snippets on data pages all
        // contain a URL, and production additionally points at the archived snapshot of
        // the page ("Browse past versions", "(archived on <date>)"). A staging server can
        // therefore never match the production reference, and because the strings have
        // different lengths the text rewraps and everything below it shifts, turning one
        // line of noise into a whole-page diff. Rewrite both sides to the same canonical
        // form so the diff on GitHub only shows real changes.
        // Note: no template literals with plain identifiers in here - run.sh pipes this
        // file through envsubst, which replaces any dollar-brace expression that looks
        // like a shell variable name with an empty string.
        const CANONICAL_ORIGIN = "https://ourworldindata.org"
        const replacements = [
          // archived snapshots: drop the snapshot timestamp and the .html suffix that
          // only the archived copy of a page carries
          [/https?:\/\/archive\.ourworldindata\.org\/\d{8}-\d{6}([^\s'")\]}]*)\.html/g, CANONICAL_ORIGIN + "$1"],
          [/https?:\/\/archive\.ourworldindata\.org\/\d{8}-\d{6}/g, CANONICAL_ORIGIN],
          // the staging server itself, and the local data API a staging bake points at
          [/https?:\/\/staging-site-[\w.-]+/g, CANONICAL_ORIGIN],
          [/https?:\/\/localhost(:\d+)?/g, CANONICAL_ORIGIN],
          // only production has an archived snapshot to date the citation with
          [/ \(archived on [^)]*\)\./g, ""],
          // data page citations stamp themselves with today's date, so a reference taken
          // yesterday differs from a branch screenshot taken today - by a line, and by a
          // rewrap whenever the month's name is a different length
          [/Retrieved [A-Z][a-z]+ \d{1,2}, \d{4} from/g, "Retrieved from"],
        ]

        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT)
        for (let node = walker.nextNode(); node; node = walker.nextNode()) {
          let text = node.nodeValue
          for (const [pattern, replacement] of replacements) {
            text = text.replace(pattern, replacement)
          }
          if (text !== node.nodeValue) node.nodeValue = text
        }

        // Two more dates, computed in the browser from the clock rather than from the
        // page's content: a data insight's dateline and the kicker on each homepage
        // announcement. Both re-render as the calendar moves - "Today" one day,
        // "Yesterday" the next, "12 days ago" a week later - so they record when the
        // screenshot was taken. The reference is re-taken on every master build and a
        // branch's run follows hours or days later, which is why branches that touch
        // nothing on the homepage still reported homepage.png as changed: on
        // timeline-end-period-labels the entire diff was 760 pixels, the digits in "10
        // DAYS AGO" and one dateline reading TODAY against YESTERDAY.
        //
        // Each is rewritten to a form its own element actually renders, so a reader of
        // the screenshot is not looking at a state the site cannot produce. For the
        // dateline that has to be a date other than today, because one published today is
        // also drawn in vermillion rather than blue: leaving the highlight class in place
        // would keep the colour flipping after the text agreed.
        //
        // Scoped by selector rather than by matching these words in any text node -
        // "Today" and "Yesterday" appear in article prose, and rewriting those would hide
        // real changes.
        const CANONICAL_DATE = "January 1"
        const CANONICAL_RELATIVE_DATE = "This Week"
        // dayjs's en relativeTime strings, plus the three cases HomepageIntro and
        // DataInsightDateline special-case ahead of fromNow(). A source string rather than
        // a literal because the regex is anchored, and the name is what the failure below
        // tells the next reader to come and edit.
        const RELATIVE_DATE_SOURCE =
          "(?:Today|Yesterday|This Week|a few seconds ago|" +
          "(?:an?|\\d+) (?:second|minute|hour|day|week|month|year)s? ago)"

        // Replace an element's text while leaving its children alone: the dateline's
        // calendar icon is an <svg> sibling of the text, and removing it would leave the
        // line looking broken in a way the reference does not.
        function replaceElementText(element, text) {
          const textNodes = [...element.childNodes].filter(
            (node) => node.nodeType === Node.TEXT_NODE
          )
          if (!textNodes.length) return
          textNodes[0].nodeValue = text
          for (const node of textNodes.slice(1)) node.nodeValue = ""
        }

        for (const dateline of document.querySelectorAll(".data-insight-dateline")) {
          dateline.classList.remove("data-insight-dateline--is-today")
          replaceElementText(dateline, CANONICAL_DATE)
        }

        // "Data update - 12 days ago": the kicker names the kind of announcement and
        // stays, only the date after it is rewritten
        const trailingRelativeDate = new RegExp(RELATIVE_DATE_SOURCE + "$")
        const announcementMetas = document.querySelectorAll(
          ".homepage-intro__announcement-meta"
        )
        // A kicker always ends in one of these, so a text that does not match means
        // grapher words it differently now. The rewrite would then silently stop matching
        // and the screenshots would go back to drifting a few pixels a day - exactly the
        // kind of diff nobody can attribute. Say so instead of shrugging.
        const unrecognisedKickers = []
        for (const meta of announcementMetas) {
          const text = meta.textContent
          if (!trailingRelativeDate.test(text)) {
            unrecognisedKickers.push(text)
            continue
          }
          replaceElementText(
            meta,
            text.replace(trailingRelativeDate, CANONICAL_RELATIVE_DATE)
          )
        }
        if (unrecognisedKickers.length) {
          reject(
            window.location.href + " has " + unrecognisedKickers.length +
            " announcement kicker(s) not ending in a date this script recognises: " +
            unrecognisedKickers.join(" | ") +
            ". Update RELATIVE_DATE_SOURCE in config.yaml."
          )
          return
        }

        // Production links to the archived versions of an article, staging has none, and
        // the link takes up a line in the header
        document
          .querySelectorAll(".centered-article-header__browse-versions-button")
          .forEach((button) => button.parentElement.remove())

        // The copy-to-clipboard buttons need the clipboard API, so they only render in a
        // secure context: production has them, a staging server served over plain HTTP
        // never does. They share a flex row with the code they copy, so their absence
        // rewraps every citation block below them.
        document
          .querySelectorAll(".code-copy-button")
          .forEach((button) => button.remove())

        // The homepage's editorial blocks are the one thing on this page that the two
        // sides of the comparison genuinely disagree about. The reference is taken
        // against production; a branch's shot is taken against a staging server baked
        // from a database snapshot taken when its container was created. Publish an
        // article in between and production has it, staging does not, so the featured
        // work list is offset by one - and because every tile is sized by its own title,
        // description and image, that offset moves everything below it. Measured on the
        // PRs open at the time: 22.1% of homepage.png differing, and the page 18 pixels
        // taller, on six branches at once, none of which touched the homepage.
        //
        // No rewrite can fix that the way canonicalising a date can: there is no value to
        // agree on, the two servers are showing different articles. So the blocks come
        // out, and the diff is left to say something about the page's layout instead.
        //
        // Scoped to the three lists, not to the sections holding them: the newsletter
        // signup form sits inside .homepage-intro beside the featured work, the
        // announcements and data-insights headers are static, and all of that is worth
        // keeping - a newsletter change is exactly the kind of homepage diff that should
        // still show up (owid-grapher#7112 was one). What is lost is regression cover for
        // the tiles' and cards' own styling, which no longer appears in any screenshot.
        // The items, not the containers holding them. Emptying
        // .homepage-intro__featured-work instead took its column out of the grid, and the
        // announcements and newsletter columns then rendered at about half their real
        // width - a layout the site never shows anyone, so any regression the screenshot
        // caught there would have been in the wrong geometry.
        const editorialItems = [
          // "New Article", "From our classics" and the rest
          ".homepage-intro__featured-tile",
          // the three items under the "Updates and announcements" heading
          ".homepage-intro__announcement",
          // the latest data insight cards, keeping the section's heading and CTA
          ".latest-data-insights__card",
        ]
        for (const selector of editorialItems) {
          document.querySelectorAll(selector).forEach((item) => item.remove())
        }

        // Force every image that has arrived to finish decoding. Two runs of the energy page
        // differed in 114,000 pixels, all by 10/255 or less - invisible, but enough to mark
        // the file as changed: a progressive image renders coarse then fine, so a capture
        // mid-decode is a slightly softer version of the same picture.
        //
        // Only the ones already `complete`: decode() on an image that has not been fetched
        // waits for the fetch, and a topic page keeps ~100 lazy thumbnails that never load
        // at all (108 on /energy), so decoding everything hung the shot until the page
        // timeout. Nothing here waits for an image - a picture that hasn't arrived isn't in
        // the screenshot either way.
        await Promise.all(
          [...document.images]
            .filter((image) => image.complete)
            .map((image) => image.decode().catch(() => {}))
        )

        // Last thing before the shot: pin each chart at the size it settled on. Taking a
        // full-page screenshot resizes the viewport to 1x1 and restores it ~175ms later.
        // Mobile CSS collapses the chart containers for that moment, grapher re-measures
        // through its ResizeObserver and redraws small, and its 400ms debounce means the
        // redraw at the restored width lands after the pixels have been read - so the shot
        // catches a narrow card sitting in a full-width figure (measured: a 208px chart in
        // a 604px container). No wait can catch this, because the chart is finished and
        // stable, just wrong. An inline width beats the media query, so the containers
        // never move and grapher never re-measures.
        for (const chart of document.querySelectorAll(".GrapherComponent")) {
          const container = chart.parentElement
          container.style.width = container.getBoundingClientRect().width + "px"
          container.style.flex = "none"
        }

        // The same transient resize also re-runs responsive image selection. 58 of the 66
        // images on /life-expectancy are a <picture> holding one <source sizes="350px">,
        // which picks a Cloudflare variant, over an <img> whose own src is a much larger
        // one; when the viewport collapses, the source stops winning for some of them and
        // the browser falls back to the <img>. Measured there: image 10 serves w=350 at
        // 1280px wide, w=1200 at 1x1, and w=350 again afterwards. Both are the same
        // picture drawn into the same 395x225 box, so the shot is a slightly sharper or
        // softer version of itself depending on where in that ~175ms window the pixels
        // were read - 66,596 pixels differing by 1 to 3 of 255, which is the band that
        // turned up on four unrelated branches at once.
        //
        // Deciding it here is the same move as pinning the chart widths above: keep what
        // the browser chose while the viewport was still the real one. Order matters - the
        // <source> elements outrank the <img>, so src has to be set while they are still
        // there, and only then can they go; dropping them first would re-resolve to the
        // large fallback, which is the state we are trying to avoid. The URL we pin is the
        // one already fetched and decoded, so nothing is refetched.
        // Only images that have actually arrived. currentSrc is set as soon as a source is
        // selected, which happens well before a lazy image is fetched, and assigning src
        // restarts the load algorithm: pinning those made three more images on
        // /life-expectancy load during the capture instead of staying absent, which both
        // moved 55,736 pixels and re-created the race this is meant to remove. An image
        // that has not loaded is not in the shot, so there is nothing to pin.
        for (const image of document.images) {
          if (!image.complete || !image.naturalWidth) continue
          const chosen = image.currentSrc
          if (!chosen) continue
          image.src = chosen
          image.removeAttribute("srcset")
          image.removeAttribute("sizes")
          const picture = image.parentElement
          if (picture && picture.tagName === "PICTURE") {
            for (const source of [...picture.querySelectorAll("source")]) source.remove()
          }
        }

        // Same transient resize reaches grapher's window-resize handler, which drives its
        // mobile layout decisions off window.innerWidth. Frozen values mean the handler
        // reads what it already had, so mobx sees no change and nothing re-renders.
        for (const dimension of ["innerWidth", "innerHeight"]) {
          const frozen = window[dimension]
          Object.defineProperty(window, dimension, { configurable: true, get: () => frozen })
        }

        resolve()
      });
    }

